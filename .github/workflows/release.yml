name: release

on:
  push:
    tags: ["v*"]
  # Rehearses the tap against a tag already released.
  workflow_dispatch:
    inputs:
      tag:
        description: an existing tag, e.g. v1.0.4
        required: true

jobs:
  pypi:
    name: publish clihub-cli to PyPI
    # A hand-run must never publish: the tag it names is already out.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      # Trusted publishing: PyPI verifies this workflow's OIDC identity, so no
      # API token exists to leak or rotate. Configured on pypi.org, not here.
      id-token: write
      contents: write        # the release this tag becomes

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: tests
        run: python -m unittest discover -s tests -t .

      - name: build
        run: |
          python -m pip install --quiet build
          python -m build

      - name: the version built must be the tag pushed
        run: |
          tag="${GITHUB_REF_NAME#v}"
          built=$(ls dist/clihub_cli-*.tar.gz | sed 's/.*clihub_cli-\(.*\)\.tar\.gz/\1/')
          test "$tag" = "$built" || {
            echo "tag $tag but built $built -- bump __version__" >&2
            exit 1
          }

      - uses: pypa/gh-action-pypi-publish@release/v1

      - name: release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" dist/* --generate-notes --title "$TAG"

  homebrew:
    name: point the tap at the published sdist
    # The formula names an sdist, which exists only once PyPI has it.
    needs: pypi
    # `needs` alone would skip this whenever pypi is skipped.
    if: always() && (needs.pypi.result == 'success'
        || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest

    steps:
      - name: find the sdist PyPI is serving
        id: sdist
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          version="${TAG#v}"
          # The JSON API lags the upload, and the URL's content-hash path
          # cannot be constructed, so there is nothing to fall back to.
          for _ in $(seq 1 30); do
            curl -sf "https://pypi.org/pypi/clihub-cli/$version/json" -o payload.json && break
            sleep 10
          done
          test -s payload.json || { echo "pypi never served $version" >&2; exit 1; }
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          files = json.load(open("payload.json"))["urls"]
          sdist = next(f for f in files if f["packagetype"] == "sdist")
          print(f"url={sdist['url']}")
          print(f"sha256={sdist['digests']['sha256']}")
          PY

      - uses: actions/checkout@v4
        with:
          repository: nitkrar/homebrew-tap
          # GITHUB_TOKEN cannot reach another repository.
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap

      - name: point the formula at it
        working-directory: tap
        env:
          SDIST_URL: ${{ steps.sdist.outputs.url }}
          SDIST_SHA256: ${{ steps.sdist.outputs.sha256 }}
        run: |
          python3 - <<'PY'
          import os, pathlib, re

          formula = pathlib.Path("Formula/clihub.rb")
          body = formula.read_text(encoding="utf-8")
          body, urls = re.subn(r'^(  )url ".*"$',
                               lambda m: f'{m[1]}url "{os.environ["SDIST_URL"]}"',
                               body, count=1, flags=re.M)
          body, hashes = re.subn(r'^(  )sha256 ".*"$',
                                 lambda m: f'{m[1]}sha256 "{os.environ["SDIST_SHA256"]}"',
                                 body, count=1, flags=re.M)
          if (urls, hashes) != (1, 1):
              raise SystemExit(f"replaced {urls} url and {hashes} sha256, wanted one each")
          formula.write_text(body, encoding="utf-8")
          PY

      - name: commit, once the diff is only the release
        working-directory: tap
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          git diff --quiet && { echo "formula already points there"; exit 0; }
          # A wider diff is a rewrite bug, and would break `brew install`.
          git diff --stat
          test "$(git diff --numstat)" = "$(printf '2\t2\tFormula/clihub.rb')"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "clihub ${TAG#v}"
          git push
